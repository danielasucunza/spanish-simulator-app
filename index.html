<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1fb5a6" />
  <meta name="description" content="Practice real-life travel Spanish for Latin America with dialogues, audio, pronunciation feedback, and phrase sheets." />
  <title>Real Spanish Travel Simulator</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      --cream: #fff6ec;
      --card: #fffdf8;
      --ink: #202024;
      --muted: #8c8d99;
      --border: #e6e7e8;
      --orange: #ff7a2f;
      --orange-dark: #ef6a25;
      --teal: #1fb5a6;
      --teal-dark: #0d3d4a;
      --yellow: #ffd879;
      --red: #c94136;
      --green: #1f9b72;
      --purple-top: #493546;
      --shadow: 0 8px 20px rgba(45, 35, 25, 0.07);
      --shadow-hover: 0 14px 30px rgba(45, 35, 25, 0.11);
      --radius: 26px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      border-top: 14px solid var(--purple-top);
      background: var(--cream);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }

    h1, h2, h3 {
      font-family: Georgia, "DM Serif Display", "Playfair Display", serif;
      letter-spacing: -0.02em;
      line-height: 1.08;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 253, 248, 0.96);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(40, 30, 20, 0.06);
      backdrop-filter: blur(12px);
    }

    .nav {
      width: min(1140px, calc(100% - 32px));
      min-height: 84px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--orange-dark);
      min-width: 260px;
    }

    .brand-mark {
      display: block;
      width: 54px;
      height: 54px;
      border-radius: 15px;
      box-shadow: 0 8px 18px rgba(13, 61, 74, 0.12);
    }

    .brand-copy {
      display: grid;
      gap: 1px;
      line-height: 1.08;
    }

    .brand-copy span {
      color: var(--teal-dark);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: Inter, system-ui, sans-serif;
    }

    .brand-copy strong {
      color: var(--orange);
      font-family: Georgia, "DM Serif Display", serif;
      font-size: clamp(1.25rem, 2vw, 1.62rem);
      font-weight: 900;
    }

    .brand-copy em {
      display: block;
      color: var(--teal-dark);
      font-family: Inter, system-ui, sans-serif;
      font-style: normal;
      font-size: 0.62em;
      font-weight: 950;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-link {
      background: transparent;
      color: #4d4e58;
      border-radius: 14px;
      padding: 10px 16px;
      font-weight: 800;
    }

    .nav-link.active,
    .nav-link:hover {
      background: #fff0e5;
      color: var(--orange);
    }

    main {
      width: min(1140px, calc(100% - 32px));
      margin: 0 auto;
      min-height: calc(100vh - 210px);
      padding: 0 0 64px;
    }

    .hero {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      min-height: 630px;
      padding: 82px 24px 96px;
      display: grid;
      place-items: center;
      text-align: center;
      color: white;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.06) 2px, transparent 2px),
        linear-gradient(0deg, rgba(255,255,255,0.06) 2px, transparent 2px),
        linear-gradient(135deg, #197d7b 0%, #2caaa0 100%);
      background-size: 43px 43px, 43px 43px, auto;
    }

    .hero-inner { width: min(880px, 100%); }
    .hero h1 { margin: 26px auto 18px; font-size: clamp(3rem, 6vw, 5rem); color: white; }
    .hero .accent { color: var(--yellow); }
    .hero p { margin: 0 auto; max-width: 760px; color: #e9f4f3; font-size: clamp(1.1rem, 2vw, 1.45rem); font-weight: 650; }

    .eyebrow,
    .label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow {
      color: var(--yellow);
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 10px 16px;
    }

    .label { color: var(--muted); }

    .hero-actions,
    .row-actions,
    .footer-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-actions { justify-content: center; margin-top: 34px; }
    .footer-actions { margin-top: 18px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      min-height: 46px;
      padding: 13px 24px;
      font-weight: 900;
      transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.02); }
    .btn-primary { background: var(--orange); color: white; box-shadow: 0 12px 24px rgba(242,112,36,0.22); }
    .btn-primary:hover { background: var(--orange-dark); }
    .btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--border); }
    .hero .btn-secondary { background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.35); }
    .btn-teal { background: var(--teal); color: white; }
    .btn-yellow { background: var(--yellow); color: var(--ink); }
    .btn-small { min-height: 36px; padding: 8px 14px; font-size: 0.9rem; }
    .btn-audio-active { background: var(--teal-dark); color: white; border-color: var(--teal-dark); }

    .section-title {
      margin: 64px 0 28px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }

    .section-title h2 { margin: 0; font-size: clamp(1.8rem, 3vw, 2.3rem); }
    .section-title p { margin: 8px 0 0; color: var(--muted); font-size: 1.08rem; font-weight: 650; }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .path-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin: 28px 0;
    }

    .path-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .path-card.active {
      border-color: rgba(35,143,140,0.42);
      box-shadow: 0 18px 42px rgba(35,143,140,0.14);
    }

    .path-card.done::after {
      content: "✓";
      position: absolute;
      top: 18px;
      right: 18px;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--teal);
      color: white;
      font-weight: 950;
    }

    .path-number {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: #e8f7f5;
      color: var(--teal);
      font-weight: 950;
      margin-bottom: 12px;
    }

    .guided-note {
      margin: 28px 0;
      padding: 20px 24px;
      border-radius: 22px;
      background: #e8f7f5;
      border: 1px solid rgba(35,143,140,0.2);
      color: #155f60;
      font-weight: 800;
    }

    .guided-next {
      margin-top: 28px;
      display: grid;
    }

    .guided-next .btn {
      width: 100%;
      min-height: 58px;
      font-size: 1.05rem;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 18px 24px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-icon { display: block; font-size: 2rem; margin-bottom: 12px; }
    .stat strong { display: block; color: var(--teal); font-family: Georgia, serif; font-size: 2.55rem; line-height: 1; }
    .stat span:last-child { color: var(--muted); font-size: 0.76rem; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }

    .module-card,
    .card,
    .practice-card,
    .dialogue-list,
    .question-card,
    .phrase-card,
    .detail-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .module-card {
      overflow: hidden;
      min-height: 380px;
      display: grid;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .module-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .module-card.locked {
      position: relative;
      cursor: pointer;
      background: #efede8;
      border-color: #d5cec5;
      box-shadow: none;
      filter: grayscale(0.75);
      opacity: 0.78;
    }

    .module-card.locked::after {
      content: "🔒 Full Access";
      position: absolute;
      top: 16px;
      right: 16px;
      border-radius: 999px;
      padding: 8px 13px;
      background: rgba(32,32,36,0.82);
      color: white;
      font-size: 0.76rem;
      font-weight: 900;
    }

    .module-card.locked:hover {
      filter: grayscale(0.45);
      opacity: 0.92;
      transform: translateY(-2px);
    }

    .module-card.locked .module-banner { filter: saturate(0.25); }
    .module-card.locked .progress-wrap { display: none; }

    .module-banner {
      min-height: 138px;
      display: grid;
      place-items: center;
      font-size: 3.2rem;
      background: linear-gradient(135deg, #1d8d8b, #38bbb4);
    }

    .module-card:nth-child(2n) .module-banner { background: linear-gradient(135deg, #f07022, #ff9969); }
    .module-card:nth-child(3n) .module-banner { background: linear-gradient(135deg, #c9352e, #ee766d); }
    .module-card:nth-child(4n) .module-banner { background: linear-gradient(135deg, #a794c9, #c6aedc); }
    .module-card:nth-child(5n) .module-banner { background: linear-gradient(135deg, #80bad8, #9fcee4); }
    .module-card:nth-child(6n) .module-banner { background: linear-gradient(135deg, #7fd29a, #a5e0b8); }
    .module-card:nth-child(7n) .module-banner { background: linear-gradient(135deg, #df8882, #edaaa4); }
    .module-card:nth-child(8n) .module-banner { background: linear-gradient(135deg, #76c7b0, #99dfcf); }
    .module-card.locked .module-banner { background: linear-gradient(135deg, #a7a39d, #d8d2ca) !important; }
    .module-card.locked h3,
    .module-card.locked p { color: #6f6b68; }

    .module-content {
      padding: 28px 26px 26px;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 14px;
    }

    .module-card h3 { margin: 0 0 8px; font-family: Inter, system-ui, sans-serif; font-size: 1.35rem; letter-spacing: 0; }
    .module-card p { margin: 0; color: var(--muted); font-size: 1rem; font-weight: 650; }

    .badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      padding: 7px 14px;
      background: #e8f7f5;
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .badge.orange { background: #fff0e5; color: var(--orange); }
    .badge.gray { background: #f2eee8; color: #aaa4a0; }

    .progress-wrap {
      height: 8px;
      border-radius: 999px;
      background: #eee8df;
      overflow: hidden;
    }

    .progress-bar { height: 100%; border-radius: 999px; background: var(--teal); width: 0%; transition: width 0.25s ease; }

    .unlock-panel {
      position: relative;
      overflow: hidden;
      margin: 34px 0;
      padding: 38px;
      border-radius: var(--radius);
      background: radial-gradient(circle at top right, rgba(255,216,121,0.24), transparent 32%), linear-gradient(135deg, #133238, #238f8c);
      color: white;
      box-shadow: var(--shadow-hover);
    }

    .unlock-panel::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -90px;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
    }

    .unlock-panel h2 {
      margin: 10px 0 12px;
      color: white;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .unlock-panel p { max-width: 760px; color: rgba(255,255,255,0.9); font-weight: 750; }
    .unlock-panel .btn {
      position: relative;
      z-index: 1;
      transform: scale(1.02);
      box-shadow: 0 16px 30px rgba(255, 216, 121, 0.22);
    }

    .result-panel,
    .lead-panel {
      margin-top: 34px;
      padding: 36px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .result-score {
      display: inline-grid;
      place-items: center;
      width: 118px;
      height: 118px;
      border-radius: 999px;
      background: var(--teal);
      color: white;
      font-family: Georgia, serif;
      font-size: 2.6rem;
      font-weight: 900;
      margin: 8px 0 18px;
    }

    .lead-panel form {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .email-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 650;
    }

    .next-step-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #153940, #269690);
      color: white;
      border: 0;
      box-shadow: 0 18px 36px rgba(21, 57, 64, 0.18);
    }

    .next-step-card::after {
      content: "";
      position: absolute;
      right: -44px;
      top: -60px;
      width: 180px;
      height: 180px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
    }

    .next-step-card .label { color: var(--yellow); }
    .next-step-card p { color: rgba(255,255,255,0.92); position: relative; z-index: 1; }
    .next-step-card .btn { position: relative; z-index: 1; margin-top: 12px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(14, 16, 18, 0.64);
      backdrop-filter: blur(6px);
    }

    .modal-card {
      width: min(100%, 560px);
      border-radius: 28px;
      padding: 30px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 28px 80px rgba(0,0,0,0.24);
    }

    .modal-card h2 {
      margin: 8px 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .modal-card p {
      color: var(--muted);
      font-weight: 750;
    }

    .mission-result {
      margin-top: 16px;
      padding: 18px;
      border-radius: 18px;
      background: #e9f8f2;
      border: 1px solid #bde8d8;
      color: #16614d;
    }

    .course-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .module-head {
      margin-top: 34px;
    }

    .back-link {
      background: transparent;
      padding: 0;
      color: var(--muted);
      font-weight: 900;
    }

    .module-icon-large { display: block; margin: 34px 0 18px; font-size: 3.4rem; }
    .module-head h1 { margin: 0 0 16px; font-size: clamp(2.5rem, 5vw, 3.6rem); }
    .module-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-weight: 800; }

    .tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 36px 0 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      border-radius: 999px;
      padding: 11px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      color: #52525c;
      font-weight: 900;
    }

    .tab.active { background: var(--teal); border-color: var(--teal); color: white; }

    .scenario-card,
    .info-strip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 34px;
      box-shadow: var(--shadow);
    }

    .scenario-card { margin: 32px 0 28px; color: #4d4d58; font-size: 1.1rem; }
    .info-strip { background: #eee8df; box-shadow: none; border: 0; padding: 16px 22px; margin: 16px 0 24px; }

    .dialogue-list {
      overflow: hidden;
      margin-top: 26px;
    }

    .dialogue-line {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
    }

    .dialogue-line:last-child { border-bottom: 0; }
    .dialogue-line:nth-child(odd) { background: #e5f6f6; }
    .dialogue-line:nth-child(even) { background: #fff1e5; }

    .speaker-icon {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--teal);
      color: white;
    }

    .speaker {
      color: #777985;
      font-size: 0.86rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .spanish-line { font-size: 1.15rem; font-weight: 780; }
    .translation { color: var(--muted); margin-top: 6px; }
    mark { background: var(--yellow); color: #5c410a; border-radius: 7px; padding: 1px 5px; }

    .activity-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 42px 0 22px;
    }

    .activity-heading h2 { margin: 0; font-size: 1.8rem; }

    .grid-two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .grid-one {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .phrase-card,
    .question-card,
    .practice-card,
    .card {
      padding: 28px 30px;
    }

    .phrase-card .spanish,
    .vocab-word {
      color: var(--teal);
      font-size: 1.35rem;
      font-weight: 900;
    }

    .phrase-card.featured { border-color: var(--orange); }
    .phrase-card.featured .spanish { color: var(--orange); }

    .options { display: grid; gap: 10px; margin-top: 16px; }
    .option { width: 100%; text-align: left; background: #fbf7f1; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .option.correct { background: rgba(31,155,114,0.12); border-color: rgba(31,155,114,0.34); }
    .option.incorrect { background: rgba(201,65,54,0.12); border-color: rgba(201,65,54,0.34); }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fffefa;
      color: var(--ink);
      padding: 13px 16px;
    }

    textarea { min-height: 100px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: 3px solid rgba(35,143,140,0.18); border-color: var(--teal); }

    .field-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
    }

    .question-card strong input {
      display: inline-block;
      width: min(270px, 100%);
      margin: 0 6px;
      vertical-align: middle;
    }

    .feedback {
      background: #e8f7f5;
      border: 1px solid rgba(35,143,140,0.2);
      border-radius: 18px;
      padding: 14px 16px;
      color: #155f60;
      font-weight: 750;
      margin-top: 14px;
    }

    .warning {
      background: #fff8df;
      border: 1px solid var(--yellow);
      color: #725108;
    }

    .record-panel {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-top: 16px;
      padding: 16px;
      border-radius: 18px;
      background: #fbf7f1;
      border: 1px solid var(--border);
    }

    audio { width: 100%; margin-top: 10px; }

    .voice-panel {
      background: #fff8df;
      border: 1px solid var(--yellow);
      border-radius: 20px;
      padding: 18px;
      margin: 18px 0;
    }

    .voice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin-top: 12px;
    }

    .voice-grid label {
      display: grid;
      gap: 6px;
      color: #725108;
      font-weight: 900;
      font-size: 0.86rem;
    }

    .review-actions {
      display: grid;

      padding: 42px 30px;

    function getProgress() {
      try { return { ...defaultProgress(), ...JSON.parse(localStorage.getItem(STORAGE_KEY)) }; }
      catch { return defaultProgress(); }
    }

    function saveProgress(progress, rerender = true) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      if (rerender) render();
    }

    function todayKey() { return new Date().toISOString().slice(0, 10); }

    function touchActivity(key, xp = 5) {
      const p = getProgress();
      if (!p.activityLog[key]) {
        p.activityLog[key] = { done: true, at: new Date().toISOString() };
        p.xp += xp;
        if (p.streakDay !== todayKey()) {
          p.streak = p.streakDay ? p.streak + 1 : 1;
          p.streakDay = todayKey();
        }
        saveProgress(p, false);
      }
    }

    function normalize(text) {
      return (text || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[¿?¡!.,]/g, "").replace(/\s+/g, " ").trim();
    }

    function jsString(value) {
      return `decodeURIComponent('${encodeURIComponent(String(value || ""))}')`;
    }

    function highlightText(text, highlights = []) {
      let out = text;
      highlights.forEach(h => out = out.replace(h, `<mark>${h}</mark>`));
      return out;
    }

      const p = getProgress();
      return Object.keys(p.activityLog || {}).some(key => key.startsWith(`${moduleId}:${activity}`) || key.includes(`${moduleId}:${activity}`));

    function guidedModuleDone(moduleId) {
      return getModuleProgress(moduleId) >= 60 || GUIDED_ACTIVITIES.some(activity => moduleActivityDone(moduleId, activity));

    function renderGuidedNextButton(moduleId, activity) {
      const currentIndex = GUIDED_ACTIVITIES.indexOf(activity);
      const nextActivity = GUIDED_ACTIVITIES[currentIndex + 1];
      if (nextActivity) {
        return `<div class="guided-next"><button class="btn btn-primary" onclick="openModule('${moduleId}', '${nextActivity}')">Next: ${ACTIVITY_LABELS[nextActivity]} →</button></div>`;
      }
      const nextModule = nextStarterModuleId(moduleId);
      if (nextModule) {
        const next = modules.find(m => m.id === nextModule);
        return `<div class="guided-next"><button class="btn btn-primary" onclick="openModule('${nextModule}', 'dialogue')">Next Module: ${next.title} →</button></div>`;
      }
      return `<div class="guided-next"><button class="btn btn-primary" onclick="startFinalAssessment()">Take the Travel Check →</button></div>`;
    }

    function finalAssessmentQuestions() {
      return freeModules().flatMap(module => module.quiz.map((q, index) => ({

        options: q[1],
        correct: q[2],
        explanation: q[3],
        id: `${module.id}-${index}`
      })));
    }

    function calculateFinalScore(answers) {
      const questions = finalAssessmentQuestions();
      const score = questions.reduce((sum, q, index) => sum + (Number(answers[index]) === q.correct ? 1 : 0), 0);
      const percent = questions.length ? Math.round((score / questions.length) * 100) : 0;
      return { score, percent, total: questions.length };
    }

    function getVoiceSettings() {
      return { ...defaultProgress().voiceSettings, ...(getProgress().voiceSettings || {}) };
    }

    function spanishVoices() {
      return state.voices.filter(v => (v.lang || "").toLowerCase().startsWith("es"));
    }

    function preferredVoice(role = "narrator") {
      const settings = getVoiceSettings();
      const voices = spanishVoices();
      const chosen = voices.find(v => v.voiceURI === settings[role]);
      if (chosen) return chosen;
      const femaleHints = ["female", "mujer", "monica", "paulina", "luciana", "soledad", "marisol", "helena", "laura", "carmen", "google español"];
      const preferred = voices.find(v => femaleHints.some(h => v.name.toLowerCase().includes(h)));
      if (role === "local" && voices.length > 1) {
        const narratorVoice = voices.find(v => v.voiceURI === settings.narrator) || preferred || voices[0];
        return voices.find(v => v.voiceURI !== narratorVoice.voiceURI) || narratorVoice;
      }
      return preferred || voices[0] || null;
    }

    function voiceRoleForSpeaker(speaker) {
      if (speaker.includes("Coach") || speaker.includes("Guía")) return "coach";
      return speaker.includes("Viajero") ? "narrator" : "local";
    }

    function premiumVoiceForRole(role = "narrator") {
      return PREMIUM_VOICES[role] || PREMIUM_VOICES.neutral;
    }

    function canUsePremiumAudio() {
      return window.location.protocol !== "file:" && typeof fetch === "function";
    }

    function isAudioPlaying(key) {
      return Boolean(key && state.audio.key === key);
    }

    function audioButtonLabel(key, listenLabel = "🔊 Listen") {
      return isAudioPlaying(key) ? "⏸️ Pause" : listenLabel;
    }

    function audioButtonClass(key) {

    function stopAudio(rerender = true) {
      if (state.audio.element) {
        try {
          state.audio.element.pause();
          state.audio.element.currentTime = 0;
        } catch {}
      }
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      state.audio = { key: null, element: null, utterance: null };
      if (rerender) render();
    }

    function clearAudio(key) {
      if (!key || state.audio.key === key) {
        state.audio = { key: null, element: null, utterance: null };
        render();
      }
    }

    function speakWithBrowser(text, role = "narrator", key = "browser-audio", clearOnEnd = true) {
      if (!("speechSynthesis" in window)) {
        alert("Audio is not available in this browser.");
        return Promise.resolve();
      }
      return new Promise(resolve => {
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "es-419";
        const settings = getVoiceSettings();
        utterance.rate = settings.rate || 0.88;
        const voice = preferredVoice(role);
        if (voice) {
          utterance.voice = voice;
          utterance.lang = voice.lang || "es-419";
        }
        state.audio.utterance = utterance;
        utterance.onend = () => {
          if (clearOnEnd) clearAudio(key);
          resolve();
        };
        utterance.onerror = () => {
          if (clearOnEnd) clearAudio(key);
          resolve();
        };
        speechSynthesis.speak(utterance);
      });
    }

    async function playPremiumAudio(text, role = "narrator", key = "premium-audio", clearOnEnd = true) {
      const response = await fetch("/.netlify/functions/tts-preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          voice: premiumVoiceForRole(role),
          text
        })
      });
      if (!response.ok) throw new Error("Premium audio unavailable.");
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      state.audio.element = audio;
      return new Promise((resolve, reject) => {
        audio.onended = () => {
          URL.revokeObjectURL(url);
          if (clearOnEnd) clearAudio(key);
          resolve();
        };
        audio.onerror = () => {
          URL.revokeObjectURL(url);
          if (clearOnEnd) clearAudio(key);
          reject(new Error("Audio playback failed."));
        };
        audio.play().catch(error => {
          URL.revokeObjectURL(url);
          if (clearOnEnd) clearAudio(key);
          reject(error);
        });
      });
    }

    async function speak(text, role = "narrator") {
      return toggleAudio(`audio:${normalize(text).slice(0, 48)}`, text, role);
    }

    async function toggleAudio(key, text, role = "narrator") {
      if (isAudioPlaying(key)) {
        stopAudio();
        return;
      }
      stopAudio(false);
      state.audio.key = key;
      render();
      if (canUsePremiumAudio()) {
        try {
          await playPremiumAudio(text, role, key, true);
          return;
        } catch (error) {
          if (state.audio.key !== key) return;
          await speakWithBrowser(text, role, key, true);
          return;
        }
      }
      await speakWithBrowser(text, role, key, true);
    }

    function speakPromise(text, role = "narrator", key = "dialogue") {
      if (canUsePremiumAudio()) {
        return playPremiumAudio(text, role, key, false).catch(() => speakWithBrowser(text, role, key, false));
      }
      return speakWithBrowser(text, role, key, false);
    }

    async function playDialogue(moduleId) {
      const m = modules.find(x => x.id === moduleId);
      const lines = m.dialogues.flatMap(d => d.lines);
      const key = `dialogue:${moduleId}`;
      if (isAudioPlaying(key)) {
        stopAudio();
        return;
      }
      stopAudio(false);
      state.audio.key = key;
      render();
      for (const line of lines) {
        if (state.audio.key !== key) return;
        await speakPromise(line[1], voiceRoleForSpeaker(line[0]), key);
        await new Promise(resolve => setTimeout(resolve, 170));
      }
      touchActivity(`${moduleId}:dialogue-audio`);
      clearAudio(key);
    }

      const url = new URL(window.location.href);
      url.searchParams.set("startQuiz", "1");
      url.hash = "";
      return url.toString();
    }

    function goToQuizCapture() {
      if (!RESULT_CAPTURE_URL) {
        document.querySelector("#local-result-form")?.classList.remove("hidden");
        document.querySelector("#local-result-form input")?.focus();
        return;
      }
      sessionStorage.setItem("realSpanishQuizPending", "1");
      window.location.href = RESULT_CAPTURE_URL;
    }

    function goToResultCapture() {
      goToQuizCapture();
    }

    function startFinalAssessment() {
      if (hasResultAccess()) {
        setView("assessment");
        return;
      }
      goToQuizCapture();
    }

            <button class="btn btn-yellow" onclick="goToCourse()">Keep Training for My Trip</button>
          </div>

      const modal = document.createElement("div");

      modal.className = "modal-backdrop";
      modal.innerHTML = `
        <article class="modal-card">
          <span class="badge orange">🔒 Full Course</span>
          <h2>This situation continues inside the complete course.</h2>
          <p>You started with the essentials. Inside Real Spanish to Travel, you keep building confidence for restaurants, emergencies, tours, markets, directions, and real conversations with locals.</p>
          <div class="footer-actions">
            <button class="btn btn-primary" onclick="goToCourse()">Keep Training for My Trip</button>
            <button class="btn btn-secondary" onclick="document.querySelector('#locked-modal')?.remove()">Keep Practicing Here</button>

        </article>

    function dueCards() {
      const p = getProgress();
      const now = Date.now();
      return allPhrases().filter(card => !p.reviews[card.id] || p.reviews[card.id].due <= now);

          <div class="stat"><span class="stat-icon">✅</span><strong>${Object.keys(p.activityLog).length}</strong><span>Activities done</span></div>

        </section>

    function renderHome() {
      const p = getProgress();
      app.innerHTML = `
        <section class="hero">
          <div class="hero-inner">
            <span class="eyebrow">🌎 Latin America Travel Spanish</span>
            <h1>Find out if your Spanish is <span class="accent">travel-ready</span></h1>
            <p>Practice real airport and hotel situations, then take a 2-minute Travel Spanish Check to see where you feel confident, where you might freeze, and what to learn next.</p>

            </div>

        </section>
        <div class="section-title">
          <div>
            <h2>Your Travel Spanish Checkpoint</h2>
            <p>${p.lead?.name ? `Welcome back, ${p.lead.name}.` : "Start here and follow the steps in order."} At the end, you'll get a practical diagnosis of what your Spanish needs before your next trip.</p>

        </div>
        ${renderFreebiePath()}
        <div class="section-title">
          <div>
            <h2>Start With Real Travel Situations</h2>
            <p>Begin with two guided situations first. Then take the readiness check to discover what your Spanish needs next.</p>
          </div>
        </div>
        ${renderModuleGrid(freeModules())}
        ${renderLockedModulesPreview()}
      `;
    }

    function renderFreebiePath() {
      const p = getProgress();
      const final = calculateFinalScore(p.finalAssessment?.answers || {});
      const quizDone = final.total && Object.keys(p.finalAssessment?.answers || {}).length === final.total;
      const airportDone = getModuleProgress("airport") > 0;
      const hotelDone = getModuleProgress("hotel") > 0;
      const path = [
        {
          number: 1,
          title: "Start at the airport",
          text: "Practice immigration, arrival questions, and getting transport from the airport.",
          action: airportDone ? "Continue Airport Practice" : "Start Airport Practice",
          click: "openModule('airport')",
          done: getModuleProgress("airport") >= 60,
          active: !airportDone
        },
        {
          number: 2,
          title: "Check into your hotel",
          text: "Practice reservations, Wi-Fi, breakfast, check-out, and simple hotel problems.",
          action: hotelDone ? "Continue Hotel Practice" : "Start Hotel Practice",
          click: "openModule('hotel')",
          done: getModuleProgress("hotel") >= 60,
          active: airportDone && !hotelDone
        },
        {
          number: 3,
          title: "Take your Travel Spanish Check",
          text: "Discover how ready your Spanish feels for real travel, what could make you freeze, and what to practice first.",
          action: quizDone ? "See My Diagnosis" : "Start My Travel Spanish Check",
          click: quizDone ? "setView('assessment')" : "startFinalAssessment()",
          done: quizDone,
          active: hotelDone && !quizDone
        },
        {
          number: 4,
          title: "Keep training for your trip",
          text: "Use your diagnosis as a starting point, then continue with restaurants, emergencies, tours, markets, and local conversations.",
          action: "Keep Training for My Trip",
          click: "goToCourse()",
          done: false,
          active: quizDone
        }
      ];
      return `
        <div class="guided-note">Start with step 1. Each page tells you exactly what to do next, so you can practice without guessing where to click.</div>
        <section class="path-grid">
          ${path.map(step => `<article class="path-card ${step.done ? "done" : ""} ${step.active ? "active" : ""}">
            <span class="path-number">${step.number}</span>
            <h3>${step.title}</h3>
            <p class="translation">${step.text}</p>
            <button class="btn ${step.number === 4 ? "btn-yellow" : step.active ? "btn-primary" : "btn-teal"}" onclick="${step.click}">${step.action}</button>
          </article>`).join("")}
        </section>
      `;
    }

    function renderModules() {
      app.innerHTML = `
        <div class="section-title">
          <div><h2>Start Here</h2><p>Follow these two travel situations in order. After that, take the Travel Spanish Check to get your diagnosis.</p></div>
          <button class="btn btn-secondary" onclick="downloadAllPhraseSheets()">Download PDF Phrase Sheets</button>
        </div>
        ${renderFreebiePath()}
        ${renderModuleGrid(freeModules())}
        ${renderLockedModulesPreview()}
        <div class="footer-actions" style="justify-content:center;margin-top:34px">
          <button class="btn btn-primary" onclick="startFinalAssessment()">Take the Travel Check →</button>
        </div>

    function renderLockedModulesPreview() {
      const locked = modules.filter(m => !isFreeModule(m));
      return `
        <div class="section-title">
          <div>
            <h2>Inside the Complete Simulator</h2>
            <p>These are the next travel situations students practice inside Real Spanish to Travel after the starter diagnosis.</p>
          </div>
          <button class="btn btn-yellow" onclick="goToCourse()">Keep Training for My Trip</button>
        </div>
        ${renderModuleGrid(locked)}
      `;
    }

    function renderModuleGrid(list) {
      return `<section class="module-grid">${list.map(m => `
        <article class="module-card ${isFreeModule(m) ? "" : "locked"}" onclick="${isFreeModule(m) ? `openModule('${m.id}')` : "showLockedPopup()"}">
          <div class="module-banner">${m.icon}</div>
          <div class="module-content">
            <span class="badge ${isFreeModule(m) ? "" : "orange"}">${isFreeModule(m) ? m.level : "Full Course"}</span>
            <div><h3>${m.title}</h3><p>${m.summary}</p></div>
            <div class="progress-wrap"><div class="progress-bar" style="width:${getModuleProgress(m.id)}%"></div></div>
            <span class="badge ${getModuleProgress(m.id) >= 80 ? "orange" : ""}">${isFreeModule(m) ? `${getModuleProgress(m.id)}% complete` : "🔒 Unlock in course"}</span>
          </div>
        </article>
      `).join("")}</section>`;
    }

    function showLockedModule() {
      app.innerHTML = `
        <button class="back-link" onclick="setView('modules')">← Back to Modules</button>
        ${renderUnlockPanel()}
      `;
      showLockedPopup();
      scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderModule() {
      const m = modules.find(x => x.id === state.moduleId);
      if (!m) return renderModules();
      if (!isFreeModule(m)) return showLockedModule();
      app.innerHTML = `
        <section class="module-head">
          <button class="back-link" onclick="setView('modules')">← Back to Modules</button>
          <span class="module-icon-large">${m.icon}</span>
          <h1>${m.title}</h1>
          <div class="module-meta"><span class="badge">${m.level}</span><span>${m.focus}</span></div>
        </section>
        <nav class="tabs">
          ${[
            ["dialogue", "1. Dialogue"],
            ["vocabulary", "2. Phrases"],
            ["fill", "3. Practice"],
            ["speak", "4. Speaking"],
            ["phrases", "Phrase Bank"]
          ].map(([id, label]) => `<button class="tab ${state.activity === id ? "active" : ""}" onclick="openModule('${m.id}', '${id}')">${label}</button>`).join("")}
        </nav>
        ${renderActivity(m)}
        ${FREE_MODULE_IDS.every(id => getModuleProgress(id) >= 80) ? renderUnlockPanel("complete") : ""}
      `;
    }

    function renderActivity(m) {
      if (state.activity === "vocabulary") return renderVocabulary(m);
      if (state.activity === "quiz") return renderQuiz(m);
      if (state.activity === "fill") return renderFill(m);
      if (state.activity === "speak") return renderSpeaking(m);
      if (state.activity === "phrases") return renderPhrases(m);
      return renderDialogue(m);
    }

    function speakerLabel(s) {
      if (s.includes("Viajero")) return "YOU";
      if (s.includes("Oficial")) return "IMMIGRATION OFFICER";
      if (s.includes("Recepcionista")) return "RECEPTIONIST";
      if (s.includes("Mesero")) return "SERVER";
      return s.toUpperCase();
    }

    function speakerIcon(s) {
      if (s.includes("Viajero")) return "💼";
      if (s.includes("Oficial")) return "🛂";
      if (s.includes("Recepcionista")) return "🏨";
      if (s.includes("Mesero")) return "🍽️";
      if (s.includes("Taxista")) return "🚕";
      if (s.includes("Farm")) return "💊";
      if (s.includes("Guía")) return "🧭";
      return "💬";
    }

    function renderDialogue(m) {
      const lines = m.dialogues.flatMap(d => d.lines.map(line => ({ title: d.title, line })));
      return `
        <div class="scenario-card">
          <div class="label">📍 Scenario</div>
          <p>${m.scenario}</p>
          <p><strong>Listening style practice:</strong> play each line, repeat out loud, then hide/show the translation.</p>
        </div>
        <div class="row-actions">
          <button class="btn btn-secondary" onclick="state.showTranslations = !state.showTranslations; render()">🌐 ${state.showTranslations ? "Hide Translation" : "Show Translation"}</button>
          <button class="btn btn-primary ${audioButtonClass(`dialogue:${m.id}`)}" onclick="playDialogue('${m.id}')">${audioButtonLabel(`dialogue:${m.id}`, "▶️ Play Full Dialogue")}</button>
        </div>
        <div class="dialogue-list">
          ${lines.map(({ line }, index) => `
            <div class="dialogue-line">
              <div class="speaker-icon">${speakerIcon(line[0])}</div>
              <div>
                <div class="speaker">${speakerLabel(line[0])}</div>
                <div class="spanish-line">${highlightText(line[1], line[3])}</div>
                <div class="translation ${state.showTranslations ? "" : "hidden"}">${line[2]}</div>
              </div>
              <button class="btn btn-small ${audioButtonClass(`${m.id}:line-${index}`)}" onclick="toggleAudio('${m.id}:line-${index}', ${jsString(line[1])}, '${voiceRoleForSpeaker(line[0])}'); touchActivity('${m.id}:line-${index}')">${audioButtonLabel(`${m.id}:line-${index}`, "🔊")}</button>
            </div>
          `).join("")}
        </div>
        <div class="feedback warning">💡 Yellow phrases are high-value chunks. Listen first, then repeat them out loud.</div>
        ${renderGuidedNextButton(m.id, "dialogue")}
      `;
    }

    function renderVocabulary(m) {
      touchActivity(`${m.id}:vocabulary-view`, 3);
      return `
        <div class="activity-heading"><h2>📖 Key Vocabulary</h2></div>
        <div class="grid-one">
          ${m.vocabulary.map((v, i) => `
            <article class="phrase-card">
              <div class="vocab-word">${v[0]}</div>
              <p><strong>${v[1]}</strong></p>
              <div class="label">Example</div>
              <p><em>${v[2]}</em><br><span class="translation">${v[3]}</span></p>
              <button class="btn btn-small ${audioButtonClass(`${m.id}:vocab-${i}`)}" onclick="toggleAudio('${m.id}:vocab-${i}', ${jsString(`${v[0]}. ${v[2]}`)}, 'narrator')">${audioButtonLabel(`${m.id}:vocab-${i}`, "🔊 Listen")}</button>
            </article>
          `).join("")}
        </div>
        ${renderGuidedNextButton(m.id, "vocabulary")}
      `;
    }

    function renderQuiz(m) {
      const answered = Object.keys(state.quizAnswers).length;
      const score = m.quiz.reduce((sum, q, i) => sum + (state.quizAnswers[i] === q[2] ? 1 : 0), 0);
      return `
        <div class="activity-heading"><h2>❓ Comprehension Quiz</h2></div>
        <div class="card"><strong>Score</strong><span style="float:right;font-family:Georgia,serif;color:var(--teal);font-size:2rem">${score} / ${m.quiz.length}</span><div class="progress-wrap"><div class="progress-bar" style="width:${(answered / m.quiz.length) * 100}%"></div></div></div>
        ${m.quiz.map((q, qi) => {
          const selected = state.quizAnswers[qi];
          return `<article class="question-card">
            <div class="label">Question ${qi + 1} of ${m.quiz.length}</div>
            <strong>${q[0]}</strong>
            <div class="options">${q[1].map((o, oi) => `<button class="option ${selected === oi ? (oi === q[2] ? "correct" : "incorrect") : ""}" onclick="answerQuiz('${m.id}', ${qi}, ${oi})">${o}</button>`).join("")}</div>
            ${selected !== undefined ? `<div class="feedback">${selected === q[2] ? "Good job." : "Almost."} ${q[3]}</div>` : ""}
          </article>`;
        }).join("")}
        ${renderGuidedNextButton(m.id, "vocabulary")}
      `;
    }

    function answerQuiz(moduleId, qIndex, selected) {
      state.quizAnswers[qIndex] = selected;
      const m = modules.find(x => x.id === moduleId);
      if (Object.keys(state.quizAnswers).length === m.quiz.length) {
        const score = m.quiz.reduce((sum, q, i) => sum + (state.quizAnswers[i] === q[2] ? 1 : 0), 0);
        const percent = Math.round((score / m.quiz.length) * 100);
        const p = getProgress();
        p.quizScores[moduleId] = Math.max(p.quizScores[moduleId] || 0, percent);
        if (percent >= 80 && !p.completedModules.includes(moduleId)) p.completedModules.push(moduleId);
        saveProgress(p, false);
        touchActivity(`${moduleId}:quiz`, 15);
      }
      render();
    }

    function renderAssessment() {
      const p = getProgress();
      const answers = p.finalAssessment?.answers || {};
      const questions = finalAssessmentQuestions();
      const answered = Object.keys(answers).length;
      const final = calculateFinalScore(answers);
      const complete = answered === questions.length;

      if (!hasResultAccess(p)) {
        app.innerHTML = renderPreQuizGate();
        return;
      }

      if (complete) {
        app.innerHTML = renderResults(final);
        return;
      }

      app.innerHTML = `
        <div class="section-title">
          <div>
            <h2>🎯 Travel Spanish Readiness Check</h2>
            <p>Answer based on what you would understand or say while traveling. In less than 2 minutes, you'll see which situations feel clear and which ones need more practice.</p>
          </div>
        </div>
        <div class="card">
          <strong>Progress</strong>
          <span style="float:right;font-family:Georgia,serif;color:var(--teal);font-size:2rem">${answered} / ${questions.length}</span>
          <div class="progress-wrap"><div class="progress-bar" style="width:${(answered / questions.length) * 100}%"></div></div>
        </div>
        ${questions.map((q, qi) => {
          const selected = answers[qi];
          return `<article class="question-card">
            <div class="label">${q.moduleTitle} · Question ${qi + 1} of ${questions.length}</div>
            <strong>${q.question}</strong>
            <div class="options">${q.options.map((option, oi) => `<button class="option ${Number(selected) === oi ? (oi === q.correct ? "correct" : "incorrect") : ""}" onclick="answerFinalQuestion(${qi}, ${oi})">${option}</button>`).join("")}</div>
            ${selected !== undefined ? `<div class="feedback">${Number(selected) === q.correct ? "Good job. That travel phrase is clear." : "Almost. This is a useful moment to notice the natural phrase."} ${q.explanation}</div>` : ""}
          </article>`;
        }).join("")}
        <div class="footer-actions" style="justify-content:center">
          <button class="btn btn-secondary" onclick="resetFinalQuiz()">Start Check Again</button>
        </div>
      `;
    }

    function answerFinalQuestion(index, selected) {
      const p = getProgress();
      p.finalAssessment = { ...defaultProgress().finalAssessment, ...(p.finalAssessment || {}) };
      p.finalAssessment.answers = { ...(p.finalAssessment.answers || {}), [index]: selected };
      const final = calculateFinalScore(p.finalAssessment.answers);
      if (Object.keys(p.finalAssessment.answers).length === final.total) {
        p.finalAssessment.lastScore = final.percent;
        p.finalAssessment.bestScore = Math.max(p.finalAssessment.bestScore || 0, final.percent);
        p.finalAssessment.completedAt = new Date().toISOString();
        if (!p.activityLog["starter:final-quiz"]) {
          p.activityLog["starter:final-quiz"] = { done: true, at: new Date().toISOString() };
          p.xp += 20;
        }
      }
      saveProgress(p);
    }

    function resetFinalQuiz() {
      const p = getProgress();
      p.finalAssessment = { ...defaultProgress().finalAssessment, bestScore: p.finalAssessment?.bestScore || null };
      saveProgress(p);
    }

    function renderPreQuizGate() {
      const p = getProgress();
      return `
        <section class="lead-panel">
          <span class="badge orange">2-minute travel diagnosis</span>
          <h1>Before you start, get your personalized Travel Spanish Check</h1>
          <p>Leave your details on the next page, then come right back to discover how ready your Spanish is for travel, which situations could make you freeze, and what to practice first before your next trip.</p>
          <div class="grid-two" style="margin:22px 0">
            <article class="card">
              <div class="label">What you'll find out</div>
              <p>Can you handle arrival, transport, hotel questions, and useful travel phrases without freezing?</p>
            </article>
            <article class="card">
              <div class="label">What you'll get after</div>
              <p>A simple diagnosis with your score, your strongest areas, and the next situations to practice.</p>
            </article>
          </div>
          <div class="footer-actions">
            <button class="btn btn-primary" onclick="goToQuizCapture()">Start My Travel Spanish Check</button>
          </div>
          ${!RESULT_CAPTURE_URL ? `<div class="feedback warning">Preview mode: use this form to test the quiz gate. Once your capture page is connected, this button sends students through your email form before the check.</div>` : `<p class="email-note">You'll enter your name and email first. Then the quiz opens immediately.</p>`}
          <form id="local-result-form" class="${RESULT_CAPTURE_URL ? "hidden" : ""}" onsubmit="submitLeadAndShowResults(event)">
            <input id="lead-name" name="name" placeholder="Your name" value="${escapeHtml(p.studentName || p.lead?.name || "")}" autocomplete="name" required>
            <input id="lead-email" name="email" placeholder="Your email" type="email" value="${escapeHtml(p.lead?.email || "")}" autocomplete="email" required>
            <button class="btn btn-primary" type="submit">Start My Travel Spanish Check</button>
          </form>
        </section>
      `;
    }

    function renderLeadGate(final) {
      return renderPreQuizGate();
    }

    async function submitLeadAndShowResults(event) {
      event.preventDefault();
      const name = document.querySelector("#lead-name").value.trim();
      const email = document.querySelector("#lead-email").value.trim();
      if (!name || !email) return;
      const p = getProgress();
      const final = calculateFinalScore(p.finalAssessment?.answers || {});
      p.studentName = name;
      p.lead = { name, email, capturedAt: new Date().toISOString() };
      saveProgress(p, false);

      const formData = new URLSearchParams({
        "form-name": LEAD_FORM_NAME,
        name,
        email,
        score: `${final.percent}% (${final.score}/${final.total})`,
        modules: freeModules().map(m => m.title).join(", "),
        completedAt: new Date().toISOString()
      });

      try {
        await fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });
      } catch {}

      render();
      scrollTo({ top: 0, behavior: "smooth" });
    }

    function resultMessage(percent) {
      if (percent >= 85) return "Your basics are strong. Your next step is speed, pronunciation, and more natural responses so you can speak without overthinking.";
      if (percent >= 65) return "You have a solid base. You may still freeze in faster conversations, so focus on repeating common travel questions and responses out loud.";
      return "You are building the right foundation. Start with survival phrases and short answers for airport, hotel, food, and asking for help.";
    }

    function renderResults(final) {
      const p = getProgress();
      const moduleRows = freeModules().map(m => `<div class="detail-row">
        <strong>${m.icon} ${m.title}</strong>
        <span class="translation">${getModuleProgress(m.id)}% practiced</span>
        <span class="translation">${m.level}</span>
        <span class="status-dot ${getModuleProgress(m.id) > 0 ? "active" : ""}"></span>
      </div>`).join("");
      return `
        <section class="result-panel">
          <span class="badge">Your Diagnosis</span>
          <h1>${p.lead?.name || "Your"} Travel Spanish Diagnosis</h1>
          <div class="result-score">${final.percent}%</div>
          <p><strong>${final.score} out of ${final.total} travel moments handled.</strong> ${resultMessage(final.percent)}</p>
          <div class="grid-two" style="margin-top:22px">
            <article class="card">
              <div class="label">What this tells you</div>
              <p>You practiced the situations where travelers usually freeze first: arrival, transport, hotel check-in, useful phrases, speaking practice, and practical comprehension.</p>
            </article>
            <article class="card next-step-card">
              <div class="label">What to practice next</div>
              <p>If you want to feel prepared for restaurants, emergencies, tours, markets, and real conversations with locals, continue inside Real Spanish to Travel.</p>
              <button class="btn btn-yellow" onclick="goToCourse()">Keep Training for My Trip</button>
            </article>
          </div>
        </section>
        <section class="detail-panel">
          <h2>Your Practice Breakdown</h2>
          ${moduleRows}
        </section>
        ${renderUnlockPanel("result")}
        <div class="footer-actions" style="justify-content:center">
          <button class="btn btn-secondary" onclick="resetFinalQuiz()">Retake Travel Check</button>
          <button class="btn btn-secondary" onclick="downloadAllPhraseSheets()">Download Phrase Sheets</button>
        </div>
      `;
    }

    function renderFill(m) {

    async function startRecording(index, targetText = "") {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        alert("Voice recording is not available in this browser.");
        return;
      }
      state.recording.target = targetText;
      state.recording.transcript = "";
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.recording.chunks = [];
      state.recording.recorder = new MediaRecorder(stream);
      state.recording.recorder.ondataavailable = event => state.recording.chunks.push(event.data);
      state.recording.recorder.onstop = () => {
        const blob = new Blob(state.recording.chunks, { type: "audio/webm" });
        const url = URL.createObjectURL(blob);
        const panel = document.querySelector(`#recording-${index}`);
        panel.innerHTML = `<div><strong>Your recording</strong><audio controls src="${url}"></audio></div><span class="badge orange">Saved for this session</span>`;
        panel.classList.remove("hidden");
        requestAiPronunciationFeedback(index, blob);
        touchActivity(`${state.moduleId}:recording-${index}`, 8);
      };
      state.recording.recorder.start();
      startSpeechRecognition(index);
      const panel = document.querySelector(`#recording-${index}`);
      panel.textContent = "Recording... speak naturally.";
      panel.classList.remove("hidden");
    }

    function startSpeechRecognition(index) {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const box = document.querySelector(`#pronunciation-${index}`);
      if (!Recognition) {
        if (box) {
          box.innerHTML = "Your recording will be saved for playback. Automatic pronunciation feedback is not available in this browser. Chrome usually supports this best.";
          box.classList.remove("hidden");
        }
        return;
      }
      const recognition = new Recognition();
      recognition.lang = "es-ES";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.onresult = event => {
        state.recording.transcript = Array.from(event.results).map(result => result[0].transcript).join(" ");
      };
      recognition.onerror = () => {
        if (box) {
          box.innerHTML = "I could record your voice, but I could not transcribe it this time. Try again in a quieter room or use Chrome for better speech recognition.";
          box.classList.remove("hidden");
        }
      };
      state.recording.recognition = recognition;
      try { recognition.start(); }
      catch {
        state.recording.recognition = null;
      }
    }

    function stopRecording(index) {
      if (state.recording.recorder && state.recording.recorder.state !== "inactive") {
        state.recording.recorder.stop();
        state.recording.recorder.stream.getTracks().forEach(track => track.stop());
      }
      if (state.recording.recognition) {
        try { state.recording.recognition.stop(); } catch {}
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function requestAiPronunciationFeedback(index, audioBlob) {
      const box = document.querySelector(`#pronunciation-${index}`);
      if (!box) return;
      const isLocalFile = window.location.protocol === "file:";
      if (isLocalFile) {
        renderPronunciationFeedback(index);
        return;
      }
      box.innerHTML = "<strong>AI pronunciation coach:</strong> checking your recording...";
      box.classList.remove("hidden");
      try {
        const audioBase64 = await blobToBase64(audioBlob);
        const moduleTitle = modules.find(m => m.id === state.moduleId)?.title || "";
        const response = await fetch("/.netlify/functions/pronunciation-feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audioBase64,
            mimeType: audioBlob.type || "audio/webm",
            targetText: state.recording.target,
            browserTranscript: state.recording.transcript,
            moduleTitle
          })
        });
        if (!response.ok) throw new Error("AI feedback is not available yet.");
        const data = await response.json();
        renderAiPronunciationFeedback(index, data);
      } catch (error) {
        renderPronunciationFeedback(index);
      }
    }

    function scorePronunciation(target, transcript) {
      const targetWords = normalize(target).split(" ").filter(w => w.length > 1);
      const spokenWords = normalize(transcript).split(" ").filter(w => w.length > 1);
      const matched = targetWords.filter(word => spokenWords.includes(word));
      const missing = [...new Set(targetWords.filter(word => !spokenWords.includes(word)))].slice(0, 7);
      const score = targetWords.length ? Math.round((matched.length / targetWords.length) * 100) : 0;
      return { score, matched, missing };
    }

    function renderPronunciationFeedback(index) {
      const box = document.querySelector(`#pronunciation-${index}`);
      if (!box) return;
      const target = state.recording.target || "";
      const transcript = state.recording.transcript || "";
      if (!transcript.trim()) {
        box.innerHTML = `<strong>Pronunciation note:</strong> Your audio is saved above. I could not hear enough Spanish to transcribe it automatically. Try speaking a little closer to the microphone, slower, and in a quiet room.`;
        box.classList.remove("hidden");
        return;
      }
      const result = scorePronunciation(target, transcript);
      const message = result.score >= 80
        ? "Great clarity. That would likely be understood."
        : result.score >= 55
          ? "Good start. A few key words need more clarity."
          : "Keep going. Try listening once, then recording again more slowly.";
      box.innerHTML = `
        <div class="pronunciation-result">
          <span class="pronunciation-score">${result.score}%</span>
          <div>
            <strong>${message}</strong>
            <p><strong>I heard:</strong> ${transcript}</p>
            <p><strong>Model:</strong> ${target}</p>
            ${result.missing.length ? `<p><strong>Practice these words:</strong> ${result.missing.join(", ")}</p>` : `<p><strong>Nice:</strong> the key words came through clearly.</p>`}
            <p class="translation">Try it again after listening once more. Clear rhythm and confidence matter more than sounding perfect.</p>
          </div>
        </div>
      `;
      box.classList.remove("hidden");
    }

    function renderAiPronunciationFeedback(index, data) {
      const box = document.querySelector(`#pronunciation-${index}`);
      if (!box) return;
      const tips = Array.isArray(data.tips) ? data.tips : [];
      const words = Array.isArray(data.practiceWords) ? data.practiceWords : [];
      box.innerHTML = `
        <div class="pronunciation-result">
          <span class="pronunciation-score">${data.score || 0}%</span>
          <div>
            <strong>${data.encouragement || "Nice work. Keep practicing."}</strong>
            <p><strong>AI heard:</strong> ${data.transcript || "No clear transcript."}</p>
            <p><strong>Target:</strong> ${data.targetText || state.recording.target}</p>
            ${data.correction ? `<p><strong>More natural:</strong> ${data.correction}</p>` : ""}
            ${words.length ? `<p><strong>Practice words:</strong> ${words.join(", ")}</p>` : ""}
            ${tips.length ? `<ul>${tips.map(tip => `<li>${tip}</li>`).join("")}</ul>` : ""}
            <p class="translation">AI feedback focuses on clarity, missing words, and travel communication confidence.</p>
          </div>
        </div>
      `;
      box.classList.remove("hidden");
    }

    async function coachAnswer(moduleId, i) {
      const m = modules.find(x => x.id === moduleId);
      const prompt = m.roleplay[i];
      const rawAnswer = document.querySelector(`#ai-${i}`).value.trim();
      const box = document.querySelector(`#ai-feedback-${i}`);
      if (!rawAnswer) {
        box.innerHTML = "Write one short Spanish answer first.";
        box.classList.remove("hidden");
        return;
      }
      box.innerHTML = "Checking your answer...";
      box.classList.remove("hidden");
      if (window.location.protocol !== "file:") {
        try {
          const response = await fetch("/.netlify/functions/ai-coach", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              moduleTitle: m.title,
              prompt: prompt[0],
              answer: rawAnswer,
              modelAnswer: prompt[1],
              completeAnswer: prompt[2],
              tip: prompt[3]
            })
          });
          if (!response.ok) throw new Error("AI coach unavailable.");
          const data = await response.json();
          box.innerHTML = `
            <strong>${data.summary || "Good effort."}</strong>
            <p><strong>Natural:</strong> ${data.naturalAnswer || prompt[1]}</p>
            <p><strong>More complete:</strong> ${data.completeAnswer || prompt[2]}</p>
            ${Array.isArray(data.tips) ? `<ul>${data.tips.map(t => `<li>${t}</li>`).join("")}</ul>` : ""}
          `;
          touchActivity(`${moduleId}:ai-${i}`, 8);
          return;
        } catch (error) {}
      }
      const answer = normalize(rawAnswer);
      const modelWords = normalize(prompt[1]).split(" ").filter(w => w.length > 3);
      const hits = modelWords.filter(w => answer.includes(w)).length;
      let msg = "Good effort. ";
      if (hits >= 2) msg += "That answer is understandable and uses useful travel language.";
      else msg += "This may be understandable, but a more natural phrase would help.";
      box.innerHTML = `${msg}<br><strong>Natural:</strong> ${prompt[1]}<br><strong>More complete:</strong> ${prompt[2]}<br><span class="translation">${prompt[3]}</span>`;
      touchActivity(`${moduleId}:ai-${i}`, 8);
    }

            .sheet { max-width:980px; margin:0 auto; padding:20px; }
            .sheet-hero { color:white; background:linear-gradient(135deg,#16333b,#279391); border-radius:18px; padding:18px 24px; margin:0 0 12px; position:relative; overflow:hidden; page-break-after:avoid; break-after:avoid; page-break-inside:avoid; break-inside:avoid; min-height:0 !important; height:auto !important; }
            .sheet-hero:after { content:""; position:absolute; width:150px; height:150px; border-radius:50%; right:-45px; top:-70px; background:rgba(255,255,255,.08); }
            .brand { color:var(--yellow); text-transform:uppercase; letter-spacing:.12em; font-weight:900; font-size:.74rem; }
            h1 { font-family: Georgia, serif; font-size:32px; line-height:1.05; margin:8px 0 6px; }
            h2 { font-family: Georgia, serif; font-size:25px; margin:0 0 6px; }
            h3 { color:var(--orange); font-size:18px; margin:0 0 4px; }
            .scenario, .meaning { color:var(--muted); font-size:14px; }
            .sheet-section { background:#fffefa; border:1px solid var(--border); border-radius:18px; padding:18px; margin:12px 0; page-break-inside:auto; break-inside:auto; }
            .section-kicker, .mini-label { color:var(--teal); text-transform:uppercase; font-weight:900; letter-spacing:.1em; font-size:.75rem; }
            .phrase-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
            .sheet-card { border:1px solid var(--border); border-radius:14px; padding:12px; background:white; page-break-inside:avoid; break-inside:avoid; }
            .variation { margin-top:8px; color:var(--teal); font-style:italic; }
            .footer { text-align:center; color:var(--muted); padding:12px; font-size:12px; }
            @media print {
              html, body { background:white; width:auto; height:auto; }
              .sheet { max-width:none; padding:0; }
              .sheet-hero { border-radius:0; padding:10px 14px; margin:0 0 6px; min-height:0 !important; height:auto !important; max-height:95px !important; }
              .sheet-hero:after { display:none; }
              .sheet-hero h1 { font-size:22px; margin:3px 0; }
              .sheet-hero p { margin:0; font-size:10px; }
              .brand { font-size:9px; }
              .sheet-section { border-radius:0; padding:10px 0; margin:6px 0; border-left:0; border-right:0; border-top:1px solid var(--border); border-bottom:0; }
              .sheet-section:first-of-type { page-break-before:avoid; break-before:avoid; }
              .phrase-grid { grid-template-columns:repeat(2,1fr); }
              .sheet-card { padding:8px; border-radius:10px; }
              h2 { font-size:19px; }
              h3 { font-size:14px; }
              p { margin:.22em 0; font-size:11px; }
              .section-kicker, .mini-label { font-size:9px; letter-spacing:.08em; }
              .scenario, .meaning, .variation { font-size:10px; }
              @page { margin:.35in; size:auto; }
            }
            @media (max-width:720px) {
              .sheet { padding:18px; }
              h1 { font-size:34px; }
              .phrase-grid { grid-template-columns:1fr; }
            }
          </style>
        </head>
        <body>
          <main class="sheet">
            <header class="sheet-hero">
              <div class="brand">✈️ Real Spanish Travel Simulator</div>
              <h1>${escapeHtml(title)}</h1>
              <p>Ready-to-use travel phrases for real-life Spanish practice.</p>
            </header>
            ${sections}
            <div class="footer">Real Spanish Travel Simulator · Practice real-life Spanish before your next trip</div>
          </main>
        </body>
        </html>`;
    }

    function printPhraseSheet(moduleId) {
      const sheetWindow = window.open("", "_blank");
      if (!sheetWindow) {
        alert("Please allow pop-ups so the phrase sheet can open for printing or saving as PDF.");
        return;
      }
      sheetWindow.document.write(phraseSheetHtml(moduleId));
      sheetWindow.document.close();
      sheetWindow.focus();
      setTimeout(() => sheetWindow.print(), 350);
    }

    function downloadPhraseSheet(moduleId) {
      printPhraseSheet(moduleId);
      touchActivity(`${moduleId}:download`, 5);
    }

    function downloadAllPhraseSheets() {
      printPhraseSheet();
    }

    function exportProgress() {
      const p = getProgress();
      const report = `Real Spanish Travel Simulator Progress\nStudent: ${p.studentName || "Unnamed"}\nEmail: ${p.lead?.email || "Captured in Systeme / not stored here"}\nXP: ${p.xp}\nStreak: ${p.streak}\nTravel check result: ${p.finalAssessment?.lastScore ? p.finalAssessment.lastScore + "%" : "Not completed"}\n\n${modules.filter(isFreeModule).map(m => `${m.title}: ${getModuleProgress(m.id)}% complete`).join("\n")}`;
      downloadText("real-spanish-progress-report.txt", report);
    }

    function render() {
      if (state.view === "home") renderHome();
      if (state.view === "modules") renderModules();
      if (state.view === "module") renderModule();
      if (state.view === "assessment") renderAssessment();
      if (state.view === "review") renderReview();
      if (state.view === "homework") renderHomework();
      if (state.view === "daily") renderDaily();
      if (state.view === "progress") renderProgress();
    }

    if ("speechSynthesis" in window) {
      state.voices = speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => {
        state.voices = speechSynthesis.getVoices();
      };
    }

    navButtons.forEach(btn => btn.addEventListener("click", () => {
      if (btn.dataset.view === "assessment" && !hasResultAccess()) {
        startFinalAssessment();
        return;
      }
      setView(btn.dataset.view);
    }));
    syncResultAccessFromUrl();
    render();
  </script>
</body>
</html>
